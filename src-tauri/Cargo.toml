[package]
name = "nutcracker"
version = "0.1.0"
description = "API Key Manager"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
sha2 = "0.10"
rand = "0.8"
dirs = "5.0"
